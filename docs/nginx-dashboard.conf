# Example nginx reverse proxy for the GitHub Agent Bridge dashboard.
#
# Replace bridge.example.com with the public dashboard hostname. The upstream
# stays loopback-only because GitHub OAuth and dashboard authorization live in
# the FastAPI service.

server {
    listen 443 ssl http2;
    server_name bridge.example.com;

    # ssl_certificate /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for live dashboard logs and journal streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # During dashboard service restarts, show a small retry page instead of
        # nginx's generic "Bad Gateway" response.
        proxy_intercept_errors on;
        error_page 502 503 504 = @dashboard_restarting;
    }

    location @dashboard_restarting {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="5"><title>Dashboard restarting</title><style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;color:#1f2937}main{max-width:34rem;padding:2rem}h1{margin:0 0 .75rem;font-size:1.5rem}p{margin:0;line-height:1.5;color:#4b5563}@media(prefers-color-scheme:dark){body{background:#111827;color:#f9fafb}p{color:#d1d5db}}</style></head><body><main><h1>Dashboard restarting</h1><p>The bridge dashboard is applying a restart. This page will retry automatically.</p></main></body></html>';
    }
}
